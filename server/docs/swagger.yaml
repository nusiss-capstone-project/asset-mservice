definitions:
  data.AssetVO:
    properties:
      created_at:
        type: integer
      currency:
        type: string
      current_price:
        type: string
      icon_url:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      symbol:
        type: string
      updated_at:
        type: integer
    type: object
  data.BaseResponse:
    properties:
      code:
        type: integer
      data: {}
      err_msg:
        type: string
    type: object
  data.CreateDepositRequest:
    properties:
      amount:
        type: string
      currency:
        type: string
      idempotent_key:
        type: string
      payment_method_id:
        type: integer
    required:
    - amount
    - currency
    - idempotent_key
    - payment_method_id
    type: object
  data.CreateOrderRequest:
    properties:
      idempotency_key:
        type: string
      payment_method_id:
        type: integer
      quantity:
        type: string
      quote_id:
        type: string
    required:
    - idempotency_key
    - payment_method_id
    - quantity
    - quote_id
    type: object
  data.FiatAccountListVO:
    properties:
      items:
        items:
          $ref: '#/definitions/data.FiatAccountVO'
        type: array
    type: object
  data.FiatAccountVO:
    properties:
      account_id:
        type: string
      balance:
        type: string
      currency:
        type: string
      updated_at:
        type: integer
    type: object
  data.FiatTransactionVO:
    properties:
      account_id:
        type: string
      amount:
        type: string
      created_at:
        type: integer
      currency:
        type: string
      external_payment_id:
        type: string
      failure_reason:
        type: string
      payment_method_id:
        type: string
      status:
        type: string
      transaction_id:
        type: string
      transaction_no:
        type: string
      transaction_type:
        type: string
      updated_at:
        type: integer
      user_id:
        type: string
    type: object
  data.GenQuoteRequest:
    properties:
      asset_id:
        type: string
      currency:
        type: string
    required:
    - asset_id
    type: object
  data.HoldingAssetVO:
    properties:
      icon_url:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  data.HoldingListVO:
    properties:
      items:
        items:
          $ref: '#/definitions/data.HoldingVO'
        type: array
    type: object
  data.HoldingVO:
    properties:
      asset:
        $ref: '#/definitions/data.HoldingAssetVO'
      asset_id:
        type: string
      quantity:
        type: string
      updated_at:
        type: integer
      valuation:
        $ref: '#/definitions/data.HoldingValuationVO'
    type: object
  data.HoldingValuationVO:
    properties:
      amount:
        type: string
      currency:
        type: string
      unit_price:
        type: string
    type: object
  data.LedgerListVO:
    properties:
      items:
        items:
          $ref: '#/definitions/data.LedgerVO'
        type: array
      next_cursor:
        type: string
    type: object
  data.LedgerVO:
    properties:
      asset_code:
        type: string
      balance_after:
        type: string
      business_id:
        type: string
      business_type:
        type: string
      change_amount:
        type: string
      created_at:
        type: integer
      ledger_id:
        type: string
      ledger_no:
        type: string
    type: object
  data.OrderListVO:
    properties:
      items:
        items:
          $ref: '#/definitions/data.OrderVO'
        type: array
      next_cursor:
        type: string
    type: object
  data.OrderVO:
    properties:
      asset:
        $ref: '#/definitions/data.AssetVO'
      created_at:
        type: integer
      order_id:
        type: string
      order_no:
        type: string
      pay_amount:
        type: string
      pay_currency:
        type: string
      payment_id:
        type: string
      quantity:
        type: string
      quote_id:
        type: string
      status:
        type: string
      unit_price:
        type: string
      updated_at:
        type: integer
    type: object
  data.QuoteVO:
    properties:
      asset_id:
        type: string
      currency:
        type: string
      expires_at:
        type: integer
      quote_id:
        type: string
      unit_price:
        type: string
    type: object
info:
  contact: {}
paths:
  /asset-ms/v1/web/assets:
    get:
      parameters:
      - default: USD
        description: Currency
        in: query
        name: currency
        type: string
      - description: Status active|inactive
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.AssetVO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List assets
      tags:
      - Asset
  /asset-ms/v1/web/assets/{asset_id}:
    get:
      parameters:
      - description: Asset ID
        in: path
        name: asset_id
        required: true
        type: integer
      - default: USD
        description: Currency
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.AssetVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Get asset detail
      tags:
      - Asset
  /asset-ms/v1/web/deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Deposit request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CreateDepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.FiatTransactionVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Create fiat deposit
      tags:
      - Deposit
  /asset-ms/v1/web/fiat-accounts:
    get:
      parameters:
      - description: Comma-separated currencies
        in: query
        name: currencies
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.FiatAccountListVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List fiat accounts for current market
      tags:
      - Deposit
  /asset-ms/v1/web/holdings:
    get:
      parameters:
      - description: Asset ID
        in: query
        name: asset_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.HoldingListVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List holdings
      tags:
      - Holding
  /asset-ms/v1/web/ledgers:
    get:
      parameters:
      - description: Last seen ledger_id
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - description: USD or BTC
        in: query
        name: asset_code
        type: string
      - description: DEPOSIT|PURCHASE|REWARD
        in: query
        name: business_type
        type: string
      - description: Unix timestamp
        in: query
        name: from
        type: integer
      - description: Unix timestamp
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.LedgerListVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List account ledger entries
      tags:
      - Deposit
  /asset-ms/v1/web/orders:
    get:
      parameters:
      - description: pending|pay_succeed|pay_fail
        in: query
        name: status
        type: string
      - description: Asset ID
        in: query
        name: asset_id
        type: integer
      - description: Unix timestamp
        in: query
        name: created_from
        type: integer
      - description: Unix timestamp
        in: query
        name: created_to
        type: integer
      - description: Last seen order_id
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.OrderListVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      parameters:
      - description: Order request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.OrderVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Create order
      tags:
      - Order
  /asset-ms/v1/web/orders/{order_id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.OrderVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Get order detail
      tags:
      - Order
  /asset-ms/v1/web/quotes:
    post:
      consumes:
      - application/json
      parameters:
      - description: Quote request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.GenQuoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.QuoteVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Generate quote
      tags:
      - Quote
swagger: "2.0"
